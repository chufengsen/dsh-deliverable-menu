url: https://github.com/chufengsen/dsh-deliverable-menu
name: chufengsen/dsh-deliverable-menu
category: git
description:
  en: >-
    VS Code-style Git panel for DSH: side-by-side diff, file tree (new/rename/delete/run),
    cross-file search, code navigation (include jump, go-to-def, hover docs, occurrence
    highlight), Markdown preview, a side chat that forks the session with full context, and
    right-click menus on deliverable cards.
  zh: >-
    DSH 的 VS Code 式 Git 面板：并排 diff、文件树（新建/重命名/删除/运行）、跨文件搜索、
    代码导航（include 跳转/跳定义/悬停注释/双击整词高亮）、Markdown 渲染预览、
    继承会话完整上下文的侧边会话、交付卡片右键菜单。
npm: dsh-deliverable-menu
